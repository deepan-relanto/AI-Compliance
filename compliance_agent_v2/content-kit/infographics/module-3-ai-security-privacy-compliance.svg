<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
<defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e3192"/>
      <stop offset="0.55" stop-color="#5b3fb0"/>
      <stop offset="1" stop-color="#f15a24"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1d5e"/>
      <stop offset="1" stop-color="#33368f"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ecedf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
<rect x="0" y="0" width="1600" height="940" rx="0" fill="#ffffff"/>
<circle cx="1450" cy="-40" r="300" fill="url(#wash)"/>
<rect x="0" y="0" width="1600" height="7" rx="0" fill="url(#topbar)"/>
<text x="56" y="56.4" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#f15a24" letter-spacing="2.1">MODULE 03  ·  AI SECURITY, PRIVACY &amp; COMPLIANCE</text>
<text x="56" y="102" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#111427"><tspan x="56" dy="0">Match the class, share the minimum, report fast</tspan></text>
<text x="56" y="139.2" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="400" fill="#6b7185"><tspan x="56" dy="0">Once data enters a prompt it lives under someone else's systems and settings. Classify before you paste, strip what the tool does not</tspan><tspan x="56" dy="23.43">need, and stay inside approved tools.</tspan></text>
<text x="1544" y="62" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#2e3192" text-anchor="end" letter-spacing="4.5">RELANTO<tspan fill="#f15a24">.</tspan></text>
<text x="1544" y="94" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7185" text-anchor="end" letter-spacing="1.6">AI COMPLIANCE ACADEMY</text>
<text x="1544" y="118" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2e3192" text-anchor="end" letter-spacing="1.6">QUICK REFERENCE SHEET</text>
<rect x="56" y="176" width="1488" height="1" rx="0" fill="#e2e5f1"/>
<text x="56" y="206" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f15a24" letter-spacing="2.1">CLASSIFY BEFORE YOU PASTE  ·  THEN MATCH THE TOOL</text><rect x="56" y="218" width="772" height="2" rx="1" fill="#f15a24" opacity="0.28"/>
<text x="202" y="242" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7185" letter-spacing="1.6">WHAT IT COVERS</text><text x="530" y="242" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#6b7185" letter-spacing="1.6">AI RULE OF THUMB</text><rect x="56" y="262" width="772" height="72" rx="12" fill="#e3f4ee"/><rect x="56" y="262" width="5" height="72" rx="2.5" fill="#12805f"/><text x="72" y="303.74" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.4" font-weight="700" fill="#12805f">Public</text><rect x="512" y="274" width="1" height="48" rx="0" fill="#ffffff" opacity="0.9"/><text x="202" y="289.04" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="202" dy="0">Website content, press releases, published</tspan><tspan x="202" dy="19.32">reports</tspan></text><text x="530" y="289.04" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="600" fill="#12805f"><tspan x="530" dy="0">Generally safe with approved tools</tspan></text>
<rect x="56" y="344" width="772" height="72" rx="12" fill="#e6effc"/><rect x="56" y="344" width="5" height="72" rx="2.5" fill="#1d63c9"/><text x="72" y="385.74" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.4" font-weight="700" fill="#1d63c9">Internal</text><rect x="512" y="356" width="1" height="48" rx="0" fill="#ffffff" opacity="0.9"/><text x="202" y="371.04" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="202" dy="0">Org charts, memos, process docs not meant for</tspan><tspan x="202" dy="19.32">outsiders</tspan></text><text x="530" y="371.04" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="600" fill="#1d63c9"><tspan x="530" dy="0">Approved tools only, per policy</tspan></text>
<rect x="56" y="426" width="772" height="72" rx="12" fill="#fdf1de"/><rect x="56" y="426" width="5" height="72" rx="2.5" fill="#b45309"/><text x="72" y="467.74" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.4" font-weight="700" fill="#b45309">Confidential</text><rect x="512" y="438" width="1" height="48" rx="0" fill="#ffffff" opacity="0.9"/><text x="202" y="453.04" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="202" dy="0">Strategy, financials, contracts, customer lists,</tspan><tspan x="202" dy="19.32">source code</tspan></text><text x="530" y="453.04" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="600" fill="#b45309"><tspan x="530" dy="0">Only tools cleared for confidential data —</tspan><tspan x="530" dy="19.32">and share the minimum</tspan></text>
<rect x="56" y="508" width="772" height="72" rx="12" fill="#fdeaec"/><rect x="56" y="508" width="5" height="72" rx="2.5" fill="#c02434"/><text x="72" y="549.74" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.4" font-weight="700" fill="#c02434">Restricted</text><rect x="512" y="520" width="1" height="48" rx="0" fill="#ffffff" opacity="0.9"/><text x="202" y="535.04" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="202" dy="0">Trade secrets, M&amp;A, security details, sensitive</tspan><tspan x="202" dy="19.32">personal data</tspan></text><text x="530" y="535.04" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="600" fill="#c02434"><tspan x="530" dy="0">Usually excluded from AI entirely — check</tspan><tspan x="530" dy="19.32">first</tspan></text>
<g transform="translate(0 1.13)"><rect x="56" y="596" width="772" height="119.88" rx="14" fill="#ffffff" stroke="#e2e5f1" stroke-width="1"/><rect x="74" y="610" width="36" height="36" rx="11" fill="#f0e9fd"/><g transform="translate(81.5 617.5) scale(0.88)"><path d="M9 5a3.3 3.3 0 1 0 0 6.6A3.3 3.3 0 0 0 9 5zM2.8 19.6c0-3.3 2.8-5.1 6.2-5.1s6.2 1.8 6.2 5.1M16.4 6.2a3 3 0 0 1 0 5.9M18 14.9c2 .6 3.4 2.1 3.4 4.7" fill="none" stroke="#6127c4" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round"/></g><text x="123" y="624.92" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17.4" font-weight="700" fill="#111427"><tspan x="123" dy="0">Identity and contracts change the rules</tspan></text><text x="123" y="650.54" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.2" font-weight="400" fill="#4b5169"><tspan x="123" dy="0">Names, IDs, health, pay and performance data carry the strictest obligations — and a client contract can</tspan><tspan x="123" dy="20.45">forbid AI processing outright, whatever the tool allows.</tspan></text><text x="123" y="694.98" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.6" font-weight="600" fill="#6127c4"><tspan x="123" dy="0">Check the contract and the policy before the paste, not after.</tspan></text></g>
<g transform="translate(0 2.25)"><rect x="56" y="731.88" width="376" height="123.87" rx="13" fill="#fdeaec" stroke="#f4c4c9" stroke-width="1"/><g transform="translate(72 745.88) scale(0.75)"><path d="M12 3.9a8.1 8.1 0 1 0 0 16.2 8.1 8.1 0 0 0 0-16.2zM6.4 6.4l11.2 11.2" fill="none" stroke="#c02434" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="98" y="759.15" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.2" font-weight="700" fill="#c02434" letter-spacing="1.3">RISKY PROMPT</text><text x="72" y="788.92" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#111427" font-style="italic"><tspan x="72" dy="0">“Rewrite this termination letter for John Tan, ID 48812,</tspan><tspan x="72" dy="20.01">dismissed over the fraud case…”</tspan></text><text x="72" y="835.14" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.8" font-weight="700" fill="#c02434"><tspan x="72" dy="0">Real identity + case detail into an outside system.</tspan></text><rect x="452" y="731.88" width="376" height="123.87" rx="13" fill="#e3f4ee" stroke="#bfe4d6" stroke-width="1"/><g transform="translate(468 745.88) scale(0.75)"><path d="M5.5 12.6 10 17l8.5-9" fill="none" stroke="#12805f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="494" y="759.15" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.2" font-weight="700" fill="#12805f" letter-spacing="1.3">SAFER VERSION</text><text x="468" y="788.92" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#111427" font-style="italic"><tspan x="468" dy="0">“Rewrite a termination template — firm but respectful.</tspan><tspan x="468" dy="20.01">Reason: serious policy violation. Use [NAME].”</tspan></text><text x="468" y="835.14" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.8" font-weight="700" fill="#12805f"><tspan x="468" dy="0">Same task, same quality, no personal data.</tspan></text></g>
<text x="856" y="206" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2e3192" letter-spacing="2.1">SAFE PROMPTING IN FIVE MOVES</text><rect x="856" y="218" width="688" height="2" rx="1" fill="#2e3192" opacity="0.28"/>
<rect x="856" y="239" width="28" height="28" rx="9" fill="#2e3192"/><text x="870" y="257.41" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.6" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="897" y="254.32" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.4" font-weight="700" fill="#111427"><tspan x="897" dy="0">Minimum</tspan></text><text x="897" y="274.9" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="897" dy="0">Paste the paragraph, not the contract; the error, not the codebase.</tspan></text>
<rect x="856" y="290.87" width="28" height="28" rx="9" fill="#2e3192"/><text x="870" y="309.28" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.6" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="897" y="306.19" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.4" font-weight="700" fill="#111427"><tspan x="897" dy="0">Anonymize</tspan></text><text x="897" y="326.78" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="897" dy="0">Replace names with Client A, Product X, Region 1 — keep your key offline.</tspan></text>
<rect x="856" y="342.74" width="28" height="28" rx="9" fill="#2e3192"/><text x="870" y="361.15" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.6" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="897" y="358.06" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.4" font-weight="700" fill="#111427"><tspan x="897" dy="0">Generalize</tspan></text><text x="897" y="378.65" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="897" dy="0">Ask the question in abstract form when no client detail is needed.</tspan></text>
<rect x="856" y="394.62" width="28" height="28" rx="9" fill="#2e3192"/><text x="870" y="413.03" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.6" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="897" y="409.94" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.4" font-weight="700" fill="#111427"><tspan x="897" dy="0">Synthetic</tspan></text><text x="897" y="430.52" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="897" dy="0">Build templates on fictional data, then apply them inside approved systems.</tspan></text>
<rect x="856" y="446.49" width="28" height="28" rx="9" fill="#2e3192"/><text x="870" y="464.9" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.6" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="897" y="461.81" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.4" font-weight="700" fill="#111427"><tspan x="897" dy="0">Check files</tspan></text><text x="897" y="482.39" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="897" dy="0">Uploads and screenshots carry hidden tabs, metadata and stray names.</tspan></text>
<g transform="translate(0 35.24)"><text x="856" y="517.36" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f15a24" letter-spacing="2.1">TWO HABITS THAT PREVENT MOST INCIDENTS</text><rect x="856" y="529.36" width="688" height="2" rx="1" fill="#f15a24" opacity="0.28"/></g>
<g transform="translate(0 35.24)"><rect x="856" y="553.36" width="334" height="116.55" rx="14" fill="#fdeaec" stroke="#f4c4c9" stroke-width="1"/><rect x="874" y="567.36" width="36" height="36" rx="11" fill="#ffffff"/><g transform="translate(881.5 574.86) scale(0.88)"><path d="M12 3.9a8.1 8.1 0 1 0 0 16.2 8.1 8.1 0 0 0 0-16.2zM6.4 6.4l11.2 11.2" fill="none" stroke="#c02434" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round"/></g><text x="923" y="582.28" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17.4" font-weight="700" fill="#c02434"><tspan x="923" dy="0">No shadow AI</tspan></text><text x="923" y="607.9" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.2" font-weight="400" fill="#4b5169"><tspan x="923" dy="0">Personal accounts, unvetted browser</tspan><tspan x="923" dy="20.45">extensions and free websites put</tspan><tspan x="923" dy="20.45">company data outside every control.</tspan></text><rect x="1210" y="553.36" width="334" height="116.55" rx="14" fill="#fdf1de" stroke="#f3d6a8" stroke-width="1"/><rect x="1228" y="567.36" width="36" height="36" rx="11" fill="#ffffff"/><g transform="translate(1235.5 574.86) scale(0.88)"><path d="M12 4.2a7.8 7.8 0 1 0 0 15.6 7.8 7.8 0 0 0 0-15.6zM12 8.2V12l3 2.2" fill="none" stroke="#b45309" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1277" y="582.28" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17.4" font-weight="700" fill="#b45309"><tspan x="1277" dy="0">If a mistake happens</tspan></text><text x="1277" y="607.9" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.2" font-weight="400" fill="#4b5169"><tspan x="1277" dy="0">Tell your manager and security contact</tspan><tspan x="1277" dy="20.45">in minutes. Never delete to hide it —</tspan><tspan x="1277" dy="20.45">concealment is the real offence.</tspan></text></g>
<g transform="translate(0 70.48)"><rect x="856" y="687.91" width="688" height="99.6" rx="16" fill="#ecedf8" stroke="#cdcfee" stroke-width="1"/><g transform="translate(876 705.91) scale(1.08)"><path d="M12 3.9a8.1 8.1 0 1 0 0 16.2 8.1 8.1 0 0 0 0-16.2zM15.2 8.8l-1.8 4.6-4.6 1.8 1.8-4.6z" fill="none" stroke="#2e3192" stroke-width="1.66" stroke-linecap="round" stroke-linejoin="round"/></g><text x="918" y="719.11" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#2e3192"><tspan x="918" dy="0">The public-website test</tspan></text><text x="918" y="742.95" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="918" dy="0">If you would not post it on the company's public website, it is not Public data. When unsure, treat</tspan><tspan x="918" dy="19.6">it as the higher class.</tspan></text></g>
<rect x="0" y="868" width="1600" height="72" rx="0" fill="url(#footer)"/>
<rect x="0" y="868" width="8" height="72" rx="0" fill="#f15a24"/>
<g transform="translate(48 892) scale(1)"><path d="M12 3.4l1.9 5.2 5.2 1.9-5.2 1.9L12 17.6l-1.9-5.2L4.9 10.5l5.2-1.9zM18.8 16.4l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8z" fill="none" stroke="#f15a24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="82" y="909.95" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">Sensitivity lives in content and combinations, not word count — and polish is no longer proof that something is legitimate.</text>
<text x="1544" y="908.38" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b9bbe4" letter-spacing="1.4" text-anchor="end">MODULE 03 REFERENCE</text>
</svg>