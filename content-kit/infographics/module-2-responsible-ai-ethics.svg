<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif">
<defs>
    <linearGradient id="topbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e3192"/>
      <stop offset="0.55" stop-color="#5b3fb0"/>
      <stop offset="1" stop-color="#f15a24"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1d5e"/>
      <stop offset="1" stop-color="#33368f"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ecedf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
<rect x="0" y="0" width="1600" height="940" rx="0" fill="#ffffff"/>
<circle cx="1450" cy="-40" r="300" fill="url(#wash)"/>
<rect x="0" y="0" width="1600" height="7" rx="0" fill="url(#topbar)"/>
<text x="56" y="56.4" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#f15a24" letter-spacing="2.1">MODULE 02  ·  RESPONSIBLE AI &amp; ETHICS</text>
<text x="56" y="102" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#111427"><tspan x="56" dy="0">You own every AI-assisted outcome</tspan></text>
<text x="56" y="139.2" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="400" fill="#6b7185"><tspan x="56" dy="0">Principles are not posters — they are what you do at the keyboard. Run the PACT check before any sensitive AI use, match oversight to the</tspan><tspan x="56" dy="23.43">stakes, and never cross the deception line.</tspan></text>
<text x="1544" y="62" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="700" fill="#2e3192" text-anchor="end" letter-spacing="4.5">RELANTO<tspan fill="#f15a24">.</tspan></text>
<text x="1544" y="94" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#6b7185" text-anchor="end" letter-spacing="1.6">AI COMPLIANCE ACADEMY</text>
<text x="1544" y="118" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#2e3192" text-anchor="end" letter-spacing="1.6">QUICK REFERENCE SHEET</text>
<rect x="56" y="176" width="1488" height="1" rx="0" fill="#e2e5f1"/>
<text x="56" y="206" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#f15a24" letter-spacing="2.1">PRINCIPLES THAT SHOW UP IN DAILY WORK</text><rect x="56" y="218" width="456" height="2" rx="1" fill="#f15a24" opacity="0.28"/>
<rect x="56" y="238" width="456" height="119.88" rx="14" fill="#ffffff" stroke="#e2e5f1" stroke-width="1"/><rect x="74" y="252" width="36" height="36" rx="11" fill="#ecedf8"/><g transform="translate(81.5 259.5) scale(0.88)"><path d="M8 3.8h8v4.4l-1.6 3.4h-4.8L8 8.2zM4.6 13.4h14.8v3H4.6zM4.6 19.4h14.8" fill="none" stroke="#2e3192" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round"/></g><text x="123" y="266.92" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17.4" font-weight="700" fill="#111427"><tspan x="123" dy="0">Accountability stays with you</tspan></text><text x="123" y="292.54" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.2" font-weight="400" fill="#4b5169"><tspan x="123" dy="0">You can delegate the typing to AI. You cannot delegate</tspan><tspan x="123" dy="20.45">responsibility for what you send.</tspan></text><text x="123" y="336.98" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.6" font-weight="600" fill="#2e3192"><tspan x="123" dy="0">Your sign-off means you checked it.</tspan></text>
<g transform="translate(0 34)"><rect x="56" y="371.88" width="456" height="119.88" rx="14" fill="#ffffff" stroke="#e2e5f1" stroke-width="1"/><rect x="74" y="385.88" width="36" height="36" rx="11" fill="#e4f5f7"/><g transform="translate(81.5 393.38) scale(0.88)"><path d="M12 4v15M6.5 19h11M4 9h16M4 9l-2.2 5.2a3.4 3.4 0 0 0 4.4 0zM20 9l2.2 5.2a3.4 3.4 0 0 1-4.4 0z" fill="none" stroke="#0d8f9c" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round"/></g><text x="123" y="400.8" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17.4" font-weight="700" fill="#111427"><tspan x="123" dy="0">Fairness needs an active check</tspan></text><text x="123" y="426.42" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.2" font-weight="400" fill="#4b5169"><tspan x="123" dy="0">Bias enters through training data and shows up subtly in</tspan><tspan x="123" dy="20.45">people-related output.</tspan></text><text x="123" y="470.86" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.6" font-weight="600" fill="#0d8f9c"><tspan x="123" dy="0">Review shortlists, ratings and scores by hand.</tspan></text></g>
<g transform="translate(0 68)"><rect x="56" y="505.76" width="456" height="119.88" rx="14" fill="#ffffff" stroke="#e2e5f1" stroke-width="1"/><rect x="74" y="519.76" width="36" height="36" rx="11" fill="#f0e9fd"/><g transform="translate(81.5 527.26) scale(0.88)"><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12S18 18.2 12 18.2 2.5 12 2.5 12z" fill="none" stroke="#6127c4" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 9.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8z" fill="none" stroke="#6127c4" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round"/></g><text x="123" y="534.68" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17.4" font-weight="700" fill="#111427"><tspan x="123" dy="0">Transparency and explainability</tspan></text><text x="123" y="560.3" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.2" font-weight="400" fill="#4b5169"><tspan x="123" dy="0">Disclose meaningful AI involvement. “The algorithm</tspan><tspan x="123" dy="20.45">decided” is never an explanation.</tspan></text><text x="123" y="604.74" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.6" font-weight="600" fill="#6127c4"><tspan x="123" dy="0">Can't explain it without the score? It isn't ready.</tspan></text></g>
<g transform="translate(0 102)"><rect x="56" y="639.64" width="456" height="96.1" rx="14" fill="#ffffff" stroke="#e2e5f1" stroke-width="1"/><rect x="74" y="653.64" width="36" height="36" rx="11" fill="#e6effc"/><g transform="translate(81.5 661.14) scale(0.88)"><path d="M9 5a3.3 3.3 0 1 0 0 6.6A3.3 3.3 0 0 0 9 5zM2.8 19.6c0-3.3 2.8-5.1 6.2-5.1s6.2 1.8 6.2 5.1M16.4 6.2a3 3 0 0 1 0 5.9M18 14.9c2 .6 3.4 2.1 3.4 4.7" fill="none" stroke="#1d63c9" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round"/></g><text x="123" y="668.56" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17.4" font-weight="700" fill="#111427"><tspan x="123" dy="0">Meaningful human oversight</tspan></text><text x="123" y="694.18" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.2" font-weight="400" fill="#4b5169"><tspan x="123" dy="0">Never rubber-stamp an AI suggestion. Keep the authority —</tspan><tspan x="123" dy="20.45">and the time — to overrule it.</tspan></text></g>
<text x="538" y="206" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2e3192" letter-spacing="2.1">THE PACT CHECK</text><rect x="538" y="218" width="456" height="2" rx="1" fill="#2e3192" opacity="0.28"/>
<rect x="538" y="238" width="456" height="362.8" rx="16" fill="#f7f8fc" stroke="#e2e5f1" stroke-width="1"/><rect x="538" y="238" width="456" height="44" rx="16" fill="#2e3192"/><rect x="538" y="266" width="456" height="16" rx="0" fill="#2e3192"/><text x="556" y="264.41" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.6" font-weight="700" fill="#ffffff" letter-spacing="1.5">RUN THIS BEFORE ANY SENSITIVE AI USE</text><g transform="translate(954 249) scale(0.92)"><path d="M12 3.2 19 6v5.6c0 4-2.9 6.7-7 8.2-4.1-1.5-7-4.2-7-8.2V6zM8.8 11.8 11.3 14.3l4-4.4" fill="none" stroke="#a9abe6" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="556" y="293" width="32" height="32" rx="16" fill="#2e3192"/><text x="572" y="314.04" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.4" font-weight="700" fill="#ffffff" text-anchor="middle">P</text><text x="601" y="308.48" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.6" font-weight="700" fill="#111427"><tspan x="601" dy="0">Permission</tspan></text><text x="601" y="329.14" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="601" dy="0">Allowed by policy? Approved tool? Is this data appropriate to</tspan><tspan x="601" dy="19.6">share with it?</tspan></text><rect x="556" y="368.7" width="32" height="32" rx="16" fill="#2e3192"/><text x="572" y="389.74" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.4" font-weight="700" fill="#ffffff" text-anchor="middle">A</text><text x="601" y="384.18" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.6" font-weight="700" fill="#111427"><tspan x="601" dy="0">Accuracy &amp; fairness</tspan></text><text x="601" y="404.84" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="601" dy="0">Have you verified the output? Could it be biased against</tspan><tspan x="601" dy="19.6">anyone affected?</tspan></text><rect x="556" y="444.4" width="32" height="32" rx="16" fill="#2e3192"/><text x="572" y="465.44" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.4" font-weight="700" fill="#ffffff" text-anchor="middle">C</text><text x="601" y="459.88" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.6" font-weight="700" fill="#111427"><tspan x="601" dy="0">Candor</tspan></text><text x="601" y="480.54" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="601" dy="0">Would you be comfortable if everyone affected knew exactly</tspan><tspan x="601" dy="19.6">how AI was used?</tspan></text><rect x="556" y="520.1" width="32" height="32" rx="16" fill="#2e3192"/><text x="572" y="541.14" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.4" font-weight="700" fill="#ffffff" text-anchor="middle">T</text><text x="601" y="535.58" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15.6" font-weight="700" fill="#111427"><tspan x="601" dy="0">Takeover</tspan></text><text x="601" y="556.24" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="400" fill="#4b5169"><tspan x="601" dy="0">Is a human still making the consequential call, with</tspan><tspan x="601" dy="19.6">authority to overrule?</tspan></text>
<g transform="translate(0 34)"><rect x="538" y="618.8" width="456" height="180.31" rx="16" fill="#fdeaec" stroke="#f4c4c9" stroke-width="1"/><g transform="translate(556 636.8) scale(0.92)"><path d="M12 3.9a8.1 8.1 0 1 0 0 16.2 8.1 8.1 0 0 0 0-16.2zM6.4 6.4l11.2 11.2" fill="none" stroke="#c02434" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"/></g><text x="586" y="650" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#c02434"><tspan x="586" dy="0">Deception is the bright line</tspan></text><rect x="556" y="692.8" width="84.68" height="27" rx="13.5" fill="#ffffff"/><text x="568" y="710.64" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.4" font-weight="700" fill="#c02434" letter-spacing="0.3">Deception</text><rect x="648.68" y="692.8" width="103.57" height="27" rx="13.5" fill="#ffffff"/><text x="660.68" y="710.64" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.4" font-weight="700" fill="#c02434" letter-spacing="0.3">Manipulation</text><rect x="760.25" y="692.8" width="96.23" height="27" rx="13.5" fill="#ffffff"/><text x="772.25" y="710.64" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.4" font-weight="700" fill="#c02434" letter-spacing="0.3">Harassment</text><rect x="864.48" y="692.8" width="91.91" height="27" rx="13.5" fill="#ffffff"/><text x="876.48" y="710.64" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.4" font-weight="700" fill="#c02434" letter-spacing="0.3">Dishonesty</text><rect x="556" y="726.8" width="112.31" height="27" rx="13.5" fill="#ffffff"/><text x="568" y="744.64" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.4" font-weight="700" fill="#c02434" letter-spacing="0.3">Circumvention</text><text x="556" y="776.36" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.2" font-weight="600" fill="#c02434"><tspan x="556" dy="0">Never engage in these — and report them if you encounter them.</tspan></text></g>
<text x="1020" y="206" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0d8f9c" letter-spacing="2.1">OVERSIGHT MATCHES THE STAKES</text><rect x="1020" y="218" width="524" height="2" rx="1" fill="#0d8f9c" opacity="0.28"/>
<rect x="1020" y="238" width="524" height="76" rx="12" fill="#e3f4ee"/><rect x="1020" y="238" width="4" height="76" rx="2" fill="#12805f"/><text x="1035" y="280.97" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.2" font-weight="700" fill="#12805f" letter-spacing="0.4">LOW STAKES</text><text x="1167" y="264.84" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.8" font-weight="700" fill="#111427"><tspan x="1167" dy="0">Internal drafts, brainstorms, summaries</tspan></text><text x="1167" y="286.05" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.6" font-weight="400" fill="#4b5169"><tspan x="1167" dy="0">A quick read-through is enough before you use it.</tspan></text>
<rect x="1020" y="326" width="524" height="76" rx="12" fill="#fdf1de"/><rect x="1020" y="326" width="4" height="76" rx="2" fill="#b45309"/><text x="1035" y="368.97" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.2" font-weight="700" fill="#b45309" letter-spacing="0.4">MEDIUM STAKES</text><text x="1167" y="352.84" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.8" font-weight="700" fill="#111427"><tspan x="1167" dy="0">Client emails, reports, external content</tspan></text><text x="1167" y="374.05" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.6" font-weight="400" fill="#4b5169"><tspan x="1167" dy="0">Full fact-check plus your normal approval chain.</tspan></text>
<rect x="1020" y="414" width="524" height="86.98" rx="12" fill="#fdeaec"/><rect x="1020" y="414" width="4" height="86.98" rx="2" fill="#c02434"/><text x="1035" y="462.46" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.2" font-weight="700" fill="#c02434" letter-spacing="0.4">HIGH STAKES</text><text x="1167" y="440.84" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.8" font-weight="700" fill="#111427"><tspan x="1167" dy="0">Decisions about people, pay, or contracts</tspan></text><text x="1167" y="462.05" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.6" font-weight="400" fill="#4b5169"><tspan x="1167" dy="0">A documented human decision. AI informs; it never</tspan><tspan x="1167" dy="19.04">decides.</tspan></text>
<g transform="translate(0 24.31)"><rect x="1020" y="518.98" width="524" height="156.52" rx="16" fill="#ffffff" stroke="#e2e5f1" stroke-width="1"/><g transform="translate(1040 538.98) scale(1)"><path d="M12 4.2 21 19.5H3zM12 9.6v4.6M12 16.6v.6" fill="none" stroke="#f15a24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1074" y="551.18" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="16.5" font-weight="700" fill="#111427"><tspan x="1074" dy="0">Deepfakes: create never, verify always</tspan></text><text x="1074" y="578.34" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.2" font-weight="400" fill="#4b5169"><tspan x="1074" dy="0">Never create synthetic audio or video of a real person without written</tspan><tspan x="1074" dy="20.45">authorization — and always verify the unexpected request.</tspan></text><rect x="1034" y="613.9" width="496" height="47.6" rx="10" fill="#ecedf8"/><text x="1040" y="630.94" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.8" font-weight="700" fill="#2e3192"><tspan x="1040" dy="0">Urgency + secrecy + payment → verify out of band on a known number,</tspan><tspan x="1040" dy="19.6">then report it.</tspan></text></g>
<g transform="translate(0 48.61)"><rect x="1020" y="689.51" width="524" height="119.88" rx="14" fill="#ffffff" stroke="#e2e5f1" stroke-width="1"/><rect x="1038" y="703.51" width="36" height="36" rx="11" fill="#fdece4"/><g transform="translate(1045.5 711.01) scale(0.88)"><path d="M6 3.6v17M6 4.6h11l-1.8 3.6L17 11.8H6" fill="none" stroke="#f15a24" stroke-width="2.06" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1087" y="718.43" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17.4" font-weight="700" fill="#111427"><tspan x="1087" dy="0">Know your reporting channel</tspan></text><text x="1087" y="744.05" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="14.2" font-weight="400" fill="#4b5169"><tspan x="1087" dy="0">Find out now — before you need it — how to report AI misuse, fraud or</tspan><tspan x="1087" dy="20.45">a suspected deepfake at Relanto.</tspan></text><text x="1087" y="788.49" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13.6" font-weight="600" fill="#f15a24"><tspan x="1087" dy="0">Manager · HR · Legal · Security · AI policy owner</tspan></text></g>
<rect x="0" y="868" width="1600" height="72" rx="0" fill="url(#footer)"/>
<rect x="0" y="868" width="8" height="72" rx="0" fill="#f15a24"/>
<g transform="translate(48 892) scale(1)"><path d="M12 3.4l1.9 5.2 5.2 1.9-5.2 1.9L12 17.6l-1.9-5.2L4.9 10.5l5.2-1.9zM18.8 16.4l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8z" fill="none" stroke="#f15a24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="82" y="909.95" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">Any “no” or “not sure” in the PACT check? Pause — adjust it, or ask your manager, HR, Legal or the AI policy owner.</text>
<text x="1544" y="908.38" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600" fill="#b9bbe4" letter-spacing="1.4" text-anchor="end">MODULE 02 REFERENCE</text>
</svg>